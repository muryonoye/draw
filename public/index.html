<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>같이 그리기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; height: 100vh; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #333; flex-wrap: wrap; }
  button { padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer; }
  button.active { outline: 2px solid #4af; }
  #wrap { flex: 1; display: flex; justify-content: center; align-items: center; padding: 8px; min-height: 0; }
  canvas { background: #fff; max-width: 100%; max-height: 100%; touch-action: none; cursor: crosshair; border-radius: 6px; }
  #status { margin-left: auto; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<div id="bar">
  <input type="color" id="color" value="#000000">
  <input type="range" id="size" min="1" max="40" value="4">
  <button id="pen" class="active">펜</button>
  <button id="eraser">지우개</button>
  <button id="clear">전체 지우기</button>
  <button id="copy">링크 복사</button>
  <span id="status">연결 중…</span>
</div>
<div id="wrap"><canvas id="c" width="1200" height="800"></canvas></div>
<script>
const W = 1200, H = 800;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.lineCap = 'round'; ctx.lineJoin = 'round';
ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
const room = new URLSearchParams(location.search).get('room') || 'lobby';
const statusEl = document.getElementById('status');
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/?room=${encodeURIComponent(room)}`);
  ws.onopen = () => statusEl.textContent = '연결됨 · 방: ' + room;
  ws.onclose = () => { statusEl.textContent = '재연결 중…'; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'history') { clearLocal(); m.data.forEach(drawSeg); }
    else if (m.type === 'seg') drawSeg(m);
    else if (m.type === 'clear') clearLocal();
  };
}
connect();
function drawSeg(s) { ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke(); }
function clearLocal() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
let tool = 'pen';
const colorEl = document.getElementById('color'), sizeEl = document.getElementById('size');
const penBtn = document.getElementById('pen'), eraserBtn = document.getElementById('eraser');
penBtn.onclick = () => { tool = 'pen'; penBtn.classList.add('active'); eraserBtn.classList.remove('active'); };
eraserBtn.onclick = () => { tool = 'eraser'; eraserBtn.classList.add('active'); penBtn.classList.remove('active'); };
document.getElementById('clear').onclick = () => { if (confirm('모두의 그림이 지워져요. 계속할까요?')) { clearLocal(); send({ type: 'clear' }); } };
document.getElementById('copy').onclick = async () => { await navigator.clipboard.writeText(location.href); statusEl.textContent = '링크 복사됨!'; };
let drawing = false, last = null;
function pos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
canvas.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); segTo(last); });
canvas.addEventListener('pointermove', (e) => { if (drawing) segTo(pos(e)); });
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { drawing = false; last = null; }));
function segTo(p) {
  const s = { x0: last.x, y0: last.y, x1: p.x, y1: p.y, color: tool === 'eraser' ? '#ffffff' : colorEl.value, size: tool === 'eraser' ? +sizeEl.value * 3 : +sizeEl.value };
  drawSeg(s); send({ type: 'seg', ...s }); last = p;
}
</script>
</body>
</html>
